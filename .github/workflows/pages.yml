name: Deploy legal pages

# Play Console'un istediği HTTPS gizlilik/şartlar URL'sini üretir.
# Repository → Settings → Pages → Build and deployment → Source: GitHub Actions
# seçildikten sonra main'e yapılan her docs/legal değişikliğinde yayınlanır.
on:
  push:
    branches: [main]
    paths:
      - "docs/legal/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish privacy and terms
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload legal site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/legal

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
